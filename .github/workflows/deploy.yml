name: Deploy

# 실행 시간
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.settings/**'
      - '.classpath'
      - '.project'
  workflow_dispatch:

# 같은 workflow가 동시에 두 번 돌지 않게 (나중에 배포가 겹치는 것을 방지)
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/kimmyoungji/kmjblog

jobs:
  # 1) 테스트
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 소스 받기
        uses: actions/checkout@v5

      - name: JDK 17 설치
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven # maven 의존성을 캐시해서 다음 실행부터 빠르게

      - name: 테스트
        run: mvn -B test # -B 옵션은 CI 환경에서 Maven이 대화형 입력을 요구하지 않도록 함

  # 2) 이미지 빌드 & GHCR 업로드
  build:
    needs: test # 테스트가 성공해야 실행됨
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write #GITHUB_TOKEN에 GHCR 쓰기 권한
    steps:
      - name: 소스 받기
        uses: actions/checkout@v5
  
      - name: Buildx 준비
        uses: docker/setup-buildx-action@v3

      - name: GHCR 로그인
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{github.actor}}
          password: ${{secrets.GITHUB_TOKEN}}

      - name: 이미지 빌드 & GHCR 업로드
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{env.IMAGE_NAME}}:${{github.sha}}
            ${{env.IMAGE_NAME}}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{github.repository}}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: SSH 설정
        run: |
          mkdir -p ~/.ssh
        
          echo "${{ secrets.LIGHTSAIL_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan -H ${{secrets.LIGHTSAIL_HOST}} >> ~/.ssh/known_hosts

      - name: LightSail 배포
        run: |
          ssh \
          -i ~/.ssh/id_ed25519 \
          "${{secrets.LIGHTSAIL_USER}}@${{secrets.LIGHTSAIL_HOST}}" \
          '
            set -e
            cd /home/ubuntu/myblog
            docker compose pull app
            docker compose up -d app
          '