name: Deploy

# 실행 조건
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.settings/**'
      - '.classpath'
      - '.project'

  workflow_dispatch:

# 같은 workflow가 동시에 두 번 실행되지 않도록 함
concurrency:
  group: deploy
  cancel-in-progress: false


# Docker Image repository
env:
  IMAGE_NAME: ghcr.io/kimmyoungji/kmjblog


jobs:

  # =========================================================
  # 1. 테스트
  # =========================================================
  test:
    runs-on: ubuntu-latest

    steps:
      - name: 소스 받기
        uses: actions/checkout@v5

      - name: JDK 17 설치
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: 테스트
        run: mvn -B test


  # =========================================================
  # 2. Docker Image Build + GHCR Push
  # =========================================================
  build:
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: 소스 받기
        uses: actions/checkout@v5

      - name: Buildx 준비
        uses: docker/setup-buildx-action@v3

      - name: GHCR 로그인
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 이미지 빌드 & GHCR 업로드
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64

          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest

          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

          cache-from: type=gha
          cache-to: type=gha,mode=max


  # =========================================================
  # 3. Lightsail 배포
  # =========================================================
  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:

      # -------------------------------------------------------
      # SSH 준비
      # -------------------------------------------------------
      - name: SSH 설정
        run: |
          mkdir -p ~/.ssh

          echo "${{ secrets.LIGHTSAIL_SSH_KEY }}" > ~/.ssh/id_ed25519

          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan \
            -H "${{ secrets.LIGHTSAIL_HOST }}" \
            >> ~/.ssh/known_hosts


      # -------------------------------------------------------
      # SHA 기반 배포 + Rollback
      # -------------------------------------------------------
      - name: Commit SHA 기반 배포
        env:
          NEW_IMAGE: ${{ env.IMAGE_NAME }}:${{ github.sha }}

        run: |

          ssh \
            -i ~/.ssh/id_ed25519 \
            "${{ secrets.LIGHTSAIL_USER }}@${{ secrets.LIGHTSAIL_HOST }}" \
            "NEW_IMAGE='$NEW_IMAGE' bash -s" <<'REMOTE'

          set -Eeuo pipefail

          cd /home/ubuntu/myblog


          echo "========================================"
          echo "배포 시작"
          echo "새 이미지: $NEW_IMAGE"
          echo "========================================"


          # ===================================================
          # 현재 실행 중인 app 컨테이너 조회
          # ===================================================

          CURRENT_CONTAINER="$(docker compose ps -q app)"

          ROLLBACK_IMAGE="kmjblog:rollback-backup"


          if [ -n "$CURRENT_CONTAINER" ]; then

            CURRENT_IMAGE_REF="$(
              docker inspect \
                --format='{{.Config.Image}}' \
                "$CURRENT_CONTAINER"
            )"

            CURRENT_IMAGE_ID="$(
              docker inspect \
                --format='{{.Image}}' \
                "$CURRENT_CONTAINER"
            )"


            echo "현재 실행 이미지:"
            echo "$CURRENT_IMAGE_REF"


            # 현재 실행 중인 실제 이미지를
            # rollback 전용 local tag로 보존
            docker image tag \
              "$CURRENT_IMAGE_ID" \
              "$ROLLBACK_IMAGE"

            echo "Rollback 이미지 보존 완료:"
            echo "$ROLLBACK_IMAGE"

          else

            CURRENT_IMAGE_REF=""

            echo "현재 실행 중인 app 컨테이너가 없습니다."

          fi


          # ===================================================
          # 새 SHA 이미지 다운로드
          # ===================================================

          echo
          echo "새 이미지 다운로드..."
          echo "$NEW_IMAGE"

          APP_IMAGE="$NEW_IMAGE" \
            docker compose pull app


          # ===================================================
          # 새 버전 실행
          # ===================================================

          echo
          echo "새 버전 컨테이너 실행..."

          APP_IMAGE="$NEW_IMAGE" \
            docker compose up \
              -d \
              --no-deps \
              --force-recreate \
              app


          # ===================================================
          # Health Check 함수
          # ===================================================

          health_check() {

            for i in $(seq 1 30); do

              echo "Health Check (${i}/30)"

              if curl \
                -fsS \
                -o /dev/null \
                --max-time 10 \
                http://127.0.0.1:8080/blog/
              then

                return 0

              fi


              sleep 5

            done


            return 1
          }


          # ===================================================
          # 신규 버전 검증
          # ===================================================

          echo
          echo "신규 버전 Health Check 시작"


          if health_check; then

            echo
            echo "========================================"
            echo "배포 성공"
            echo "$NEW_IMAGE"
            echo "========================================"


            # 마지막 정상 배포 이미지를 .env에 기록
            if grep -q '^APP_IMAGE=' .env 2>/dev/null; then

              sed -i \
                "s|^APP_IMAGE=.*|APP_IMAGE=$NEW_IMAGE|" \
                .env

            else

              printf '\nAPP_IMAGE=%s\n' \
                "$NEW_IMAGE" \
                >> .env

            fi


            # 사람이 확인하기 위한 기록
            echo "$NEW_IMAGE" \
              > .last-successful-image


            exit 0

          fi


          # ===================================================
          # 신규 배포 실패
          # ===================================================

          echo
          echo "========================================"
          echo "신규 버전 Health Check 실패"
          echo "Rollback 시작"
          echo "========================================"


          echo
          echo "실패한 app 로그:"

          docker compose logs \
            --tail=100 \
            app \
            || true


          # 이전 컨테이너 자체가 없었다면 rollback 불가능
          if [ -z "$CURRENT_IMAGE_REF" ]; then

            echo "Rollback 가능한 기존 이미지가 없습니다."

            exit 1

          fi


          # ===================================================
          # 이전 이미지로 Rollback
          # ===================================================

          echo
          echo "Rollback 대상:"
          echo "$CURRENT_IMAGE_REF"


          APP_IMAGE="$ROLLBACK_IMAGE" \
            docker compose up \
              -d \
              --no-deps \
              --force-recreate \
              app


          # ===================================================
          # Rollback Health Check
          # ===================================================

          echo
          echo "Rollback Health Check 시작"


          if health_check; then

            echo
            echo "========================================"
            echo "Rollback 성공"
            echo "$CURRENT_IMAGE_REF"
            echo "========================================"

          else

            echo
            echo "========================================"
            echo "Rollback 후에도 서비스가 정상화되지 않음"
            echo "수동 확인 필요"
            echo "========================================"

          fi


          # Rollback이 성공했더라도
          # 신규 버전 배포 자체는 실패했으므로
          # GitHub Action은 실패 처리
          exit 1

          REMOTE


      # -------------------------------------------------------
      # 외부에서 실제 서비스 확인
      # -------------------------------------------------------
      - name: 외부 배포 확인
        run: |

          for i in $(seq 1 10); do

            if curl \
              -fsS \
              -o /dev/null \
              --max-time 10 \
              https://www.kmjoyit.xyz/blog/
            then

              echo "외부 배포 확인 성공 (${i}번째 시도)"

              exit 0

            fi


            echo "외부 서비스 확인 중... (${i}/10)"

            sleep 5

          done


          echo "외부 배포 확인 실패"

          exit 1